name = "stock-desk"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# 대시보드에서 넣은 변수(API 키 등)가 코드를 다시 배포할 때 지워지지 않게 한다
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

[version_metadata]
binding = "CF_VERSION_METADATA"

# 매수 에임가 저장소(KV). id를 고정해 두어, 배포해도 저장소가 바뀌지 않습니다.
[[kv_namespaces]]
binding = "ALERTS"
id = "31b0c57ffb8a4e6da22bb5f4ec51703c"

# 5분마다 에임가 도달 여부 확인 → 슬랙 알림
[triggers]
crons = ["*/5 * * * *"]
